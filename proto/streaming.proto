syntax = "proto3";
package streaming;

service Streaming {
  rpc CreateUser(User) returns (User);
  rpc GetUser(Id) returns (User);
  rpc ListUsers(Page) returns (UserList);
  rpc UpdateUser(User) returns (User);
  rpc DeleteUser(Id) returns (Empty);

  rpc CreateSong(Song) returns (Song);
  rpc GetSong(Id) returns (Song);
  rpc ListSongs(Page) returns (SongList);
  rpc UpdateSong(Song) returns (Song);
  rpc DeleteSong(Id) returns (Empty);

  rpc CreatePlaylist(Playlist) returns (Playlist);   // uses user_id + name
  rpc GetPlaylist(Id) returns (Playlist);
  rpc ListPlaylists(ListPlaylistsRequest) returns (PlaylistList);
  rpc UpdatePlaylist(Playlist) returns (Playlist);
  rpc DeletePlaylist(Id) returns (Empty);

  rpc AddSong(PlaylistSong) returns (Empty);
  rpc RemoveSong(PlaylistSong) returns (Empty);
  rpc ListPlaylistSongs(ListPlaylistSongsRequest) returns (SongList);
}

message Empty {}
message Id { int32 id = 1; }
message Page { int32 limit = 1; int32 offset = 2; }

message User { int32 id = 1; string name = 2; int32 age = 3; }
message Song { int32 id = 1; string name = 2; string artist = 3; }
message Playlist { int32 id = 1; string name = 2; int32 user_id = 3; }

message UserList { repeated User items = 1; }
message SongList { repeated Song items = 1; }
message PlaylistList { repeated Playlist items = 1; }

message PlaylistSong { int32 playlist_id = 1; int32 song_id = 2; }
message ListPlaylistsRequest { int32 user_id = 1; int32 limit = 2; int32 offset = 3; }
message ListPlaylistSongsRequest { int32 playlist_id = 1; int32 limit = 2; int32 offset = 3; }